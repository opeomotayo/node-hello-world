inputSet:
  name: push_to_main
  identifier: push_to_main
  orgIdentifier: default
  projectIdentifier: default_project
  pipeline:
    identifier: nodehelloworld
    properties:
      ci:
        codebase:
          build:
            type: branch
            spec:
              branch: <+trigger.branch>
    stages:
      - stage:
          identifier: Deploy_PreProd
          type: Deployment
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: Node_Hello_World_Artifact
                        sources:
                          - identifier: Node_Hello_World_Artifact
                            type: DockerRegistry
                            spec:
                              tag: <+trigger.commitShortSha>
      - stage:
          identifier: Deploy_Prod
          type: Deployment
          spec:
            service:
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: Node_Hello_World_Artifact
                        sources:
                          - identifier: Node_Hello_World_Artifact
                            type: DockerRegistry
                            spec:
                              tag: <+trigger.commitShortSha>