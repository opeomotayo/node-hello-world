replicaCount: 2

image:
  repository: opeomotayo/node-hello-world
  tag: <+artifacts.primary.tag>
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  APP_VERSION: "1.0.0"